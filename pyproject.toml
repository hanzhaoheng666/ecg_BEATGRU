[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatgru-causal"
version = "1.0.0"
description = "Causal online N/S/V beat classification on the standard MIT-BIH DS1/DS2 split"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "torch>=2.0", "wfdb>=4.1"]

[tool.setuptools]
packages = ["beatgru"]
